<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="15%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes flowLine {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: flowLine 2.5s linear infinite;
      }
      .pulse-item {
        transform-origin: center;
        animation: pulseNode 3s ease-in-out infinite;
      }
      .float-1 { animation: floatParticle 4s ease-in-out infinite; }
      .float-2 { animation: floatParticle 4.8s ease-in-out infinite 0.7s; }
      .float-3 { animation: floatParticle 4.2s ease-in-out infinite 1.4s; }
      .glow-animate { animation: glowPulse 4s ease-in-out infinite; }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Glows -->
  <circle cx="600" cy="140" r="320" fill="url(#glowViolet)" class="glow-animate" />
  <circle cx="200" cy="300" r="260" fill="url(#glowCyan)" class="glow-animate" />
  <circle cx="1000" cy="300" r="260" fill="url(#glowPink)" class="glow-animate" />

  <!-- Grid overlay subtle -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Pipeline Flow Lines (Behind Foreground Cards & Text) -->
  <g fill="none" stroke-width="2">
    <!-- Left to Center streams -->
    <path d="M 120 345 C 240 345, 300 310, 430 310" stroke="#06b6d4" stroke-opacity="0.6" class="flow-path" />
    <path d="M 270 345 C 330 345, 370 310, 430 310" stroke="#3b82f6" stroke-opacity="0.6" class="flow-path" />
    <path d="M 430 310 L 520 310" stroke="#8b5cf6" stroke-opacity="0.8" class="flow-path" />

    <!-- Center to Right streams -->
    <path d="M 680 310 L 770 310" stroke="#a855f7" stroke-opacity="0.8" class="flow-path" />
    <path d="M 770 310 C 850 310, 880 345, 960 345" stroke="#ec4899" stroke-opacity="0.6" class="flow-path" />
    <path d="M 770 310 C 870 310, 930 345, 1080 345" stroke="#f59e0b" stroke-opacity="0.6" class="flow-path" />
  </g>

  <!-- FOREGROUND: Header Badge -->
  <g transform="translate(600, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-116" cy="0" r="4" fill="#10b981" />
    <text x="-104" y="4.5" fill="#c7d2fe" font-size="11" font-weight="700" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">ENTERPRISE &amp; OPEN SOURCE ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <text x="600" y="112" text-anchor="middle" class="banner-title" font-size="42" fill="#ffffff" filter="url(#shadow)">
    Awesome Multi-Modal Pipeline Orchestration
  </text>

  <!-- Decorative Gradient Underline -->
  <rect x="360" y="128" width="480" height="4" rx="2" fill="url(#primaryGrad)" />

  <!-- FOREGROUND: Subtitle -->
  <text x="600" y="165" text-anchor="middle" class="banner-sub" font-size="18" fill="#94a3b8">
    Unified Systems for Processing Video, Audio, Text &amp; Structured Data at Production Scale
  </text>

  <!-- Floating Feature Badges -->
  <g transform="translate(600, 208)">
    <!-- Pill 1: Multimodal RAG -->
    <g transform="translate(-390, 0)" class="float-1">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" fill="#38bdf8" class="tag-text">🎥 Video &amp; Audio RAG</text>
    </g>

    <!-- Pill 2: Distributed Compute -->
    <g transform="translate(-130, 0)" class="float-2">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" fill="#c084fc" class="tag-text">⚡ Distributed AI Compute</text>
    </g>

    <!-- Pill 3: Workflow DAGs -->
    <g transform="translate(140, 0)" class="float-3">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" fill="#f472b6" class="tag-text">🔄 Dynamic Workflow DAGs</text>
    </g>

    <!-- Pill 4: Agent Runtimes -->
    <g transform="translate(390, 0)" class="float-1">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" fill="#34d399" class="tag-text">🤖 Agentic Inference</text>
    </g>
  </g>

  <!-- LOWER PIPELINE ARCHITECTURE FLOW DIAGRAM (FOREGROUND SAFE) -->
  <g transform="translate(0, 20)">
    <!-- Stage 1: Ingestion Sources -->
    <g transform="translate(100, 290)">
      <rect x="0" y="0" width="190" height="70" rx="10" fill="#131c31" stroke="#334155" stroke-width="1.2" />
      <text x="95" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">HETEROGENEOUS INPUTS</text>
      <text x="95" y="48" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Video • Audio • PDF • Web</text>
    </g>

    <!-- Stage 2: Partitioning & Chunking -->
    <g transform="translate(325, 290)">
      <rect x="0" y="0" width="180" height="70" rx="10" fill="#131c31" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">ETL &amp; TOKENIZATION</text>
      <text x="90" y="48" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Daft • Unstructured • VLM</text>
    </g>

    <!-- Stage 3: Orchestration Engine (Centerpiece) -->
    <g transform="translate(535, 280)">
      <rect x="0" y="0" width="190" height="88" rx="12" fill="#1a1c3b" stroke="url(#primaryGrad)" stroke-width="2" class="pulse-item" />
      <text x="95" y="26" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="800" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">CORE ORCHESTRATION</text>
      <text x="95" y="50" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Ray • Dagster • Prefect</text>
      <text x="95" y="70" text-anchor="middle" fill="#a5b4fc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Modal • Flyte • Airflow</text>
    </g>

    <!-- Stage 4: Embeddings & Vector Stores -->
    <g transform="translate(755, 290)">
      <rect x="0" y="0" width="175" height="70" rx="10" fill="#131c31" stroke="#334155" stroke-width="1.2" />
      <text x="87" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">MULTIMODAL INDEXING</text>
      <text x="87" y="48" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Milvus • Qdrant • txtai</text>
    </g>

    <!-- Stage 5: Downstream Consumption -->
    <g transform="translate(960, 290)">
      <rect x="0" y="0" width="180" height="70" rx="10" fill="#131c31" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">INFERENCE &amp; APPS</text>
      <text x="90" y="48" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">vLLM • Dify • Pipecat</text>
    </g>
  </g>
</svg>
